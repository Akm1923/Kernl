[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernl"
version = "0.2.0"
description = "Windows-first local AI compute platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7", "pydantic>=2.7", "psutil>=5.9", "keyring>=25.2", "httpx>=0.27", "huggingface-hub>=0.26"]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.11"]

[project.scripts]
kernl = "kernl.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kernl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
